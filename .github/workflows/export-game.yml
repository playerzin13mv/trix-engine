name: Export game
on:
  workflow_dispatch:
    inputs:
      game:
        description: "pasta do jogo dentro de games/"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Embutir o jogo no APK
        run: |
          rm -rf app/src/main/assets/game
          mkdir -p app/src/main/assets
          cp -r "games/${{ inputs.game }}" app/src/main/assets/game
      - name: Build
        run: gradle assembleDebug --no-daemon -PgameSlug=${{ inputs.game }}
      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ inputs.game }}.apk"
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-${{ inputs.game }}
          name: "Jogo: ${{ inputs.game }}"
          prerelease: true
          files: ${{ inputs.game }}.apk
